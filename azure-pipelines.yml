trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  dockerServiceConnection: 'dockerhub-navigator81'
  azureServiceConnection: 'ValeurTech-ServiceConnection'

  imageRepository: 'navigator81/my-webpage'
  imageTag: '$(Build.BuildId)'

  resourceGroup: 'rg-personal-website'
  containerAppName: 'personal-website'

  # Replace this with the actual Application URL from Azure.
  containerAppUrl: 'https://personal-website.agreeablebush-ba55f445.westus2.azurecontainerapps.io'
stages:
  - stage: Validate
    displayName: Validate Website Files

    jobs:
      - job: ValidateFiles
        displayName: Validate Deployment Files

        steps:
          - checkout: self

          - script: |
              set -e

              test -f Dockerfile
              test -f index.html
              test -f umer-intro.mp4

              grep -q "FROM nginx" Dockerfile
              grep -qi "<html" index.html

              echo "Required website files are valid."
            displayName: Validate Required Files

  - stage: Build
    displayName: Building Docker Image
    dependsOn: Validate
    condition: succeeded()

    jobs:
      - job: BuildImage
        displayName: Build Website Container

        steps:
          - checkout: self

          - task: Docker@2
            displayName: Sign in to Docker Hub
            inputs:
              command: login
              containerRegistry: '$(dockerServiceConnection)'

          - script: |
              set -e

              docker buildx create \
                --use \
                --name website-builder

              docker buildx inspect --bootstrap

              docker buildx build \
                --platform linux/amd64 \
                --file "$(Build.SourcesDirectory)/Dockerfile" \
                --tag "$(imageRepository):$(imageTag)" \
                --tag "$(imageRepository):latest" \
                --push \
                "$(Build.SourcesDirectory)"
            displayName: Build and Push linux/amd64 Image

  - stage: Deploy
    displayName: Deploy to Azure Container Apps
    dependsOn: Build
    condition: succeeded()

    jobs:
      - job: DeployContainer
        displayName: Update Personal Website

        steps:
          - task: AzureContainerApps@1
            displayName: Deploy New Container Image
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              containerAppName: '$(containerAppName)'
              resourceGroup: '$(resourceGroup)'
              imageToDeploy: '$(imageRepository):$(imageTag)'

  - stage: SmokeTest
    displayName: Test Deployed Website
    dependsOn: Deploy
    condition: succeeded()

    jobs:
      - job: VerifyWebsite
        displayName: Verify Website Response

        steps:
          - script: |
              set -e

              echo "Waiting for Azure Container Apps to activate the revision..."
              sleep 20

              HTTP_STATUS=$(curl \
                --silent \
                --output response.html \
                --write-out "%{http_code}" \
                --retry 6 \
                --retry-delay 10 \
                "$(containerAppUrl)")

              echo "HTTP status: $HTTP_STATUS"

              if [ "$HTTP_STATUS" != "200" ]; then
                echo "Website test failed."
                cat response.html
                exit 1
              fi

              grep -qi "<html" response.html

              echo "Deployment and smoke test succeeded."
            displayName: Test Live Website
