trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  dockerServiceConnection: 'dockerhub-navigator81'
  azureServiceConnection: 'ValeurTech-ServiceConnection'

  imageRepository: 'navigator81/my-webpage'
  imageTag: '$(Build.BuildId)'

  resourceGroup: 'rg-personal-website'
  containerAppName: 'personal-website'

stages:
  - stage: Build
    displayName: Build and Push Docker Image

    jobs:
      - job: BuildImage
        displayName: Build Website Container

        steps:
          - checkout: self

          - task: Docker@2
            displayName: Sign in to Docker Hub
            inputs:
              command: login
              containerRegistry: '$(dockerServiceConnection)'

          - script: |
              docker buildx create --use --name website-builder
              docker buildx inspect --bootstrap

              docker buildx build \
                --platform linux/amd64 \
                --file "$(Build.SourcesDirectory)/Dockerfile" \
                --tag "$(imageRepository):$(imageTag)" \
                --tag "$(imageRepository):latest" \
                --push \
                "$(Build.SourcesDirectory)"
            displayName: Build and Push linux/amd64 Image

  - stage: Deploy
    displayName: Deploy to Azure Container Apps
    dependsOn: Build
    condition: succeeded()

    jobs:
      - job: DeployContainer
        displayName: Update Personal Website

        steps:
          - task: AzureContainerApps@1
            displayName: Deploy New Container Image
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              containerAppName: '$(containerAppName)'
              resourceGroup: '$(resourceGroup)'
              imageToDeploy: '$(imageRepository):$(imageTag)'